<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Split-level walkthrough with addition and deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/styles.css">
</head>
<body>
<div id="stage"></div>
<div id="labels"></div>
<div id="loading">Building the house…</div>
<div id="todBusy" role="status" aria-label="Loading" hidden><div class="busyBox"><span class="busy"></span><p id="busyText"></p></div></div>
<div id="err" class="panel"></div>

<div id="bar" class="panel">
  <div class="brand"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 11.5 12 4l9 7.5M5.5 9.8V20h13V9.8M9.5 20v-5.5h5V20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg></span>
    <div><h1>Split-level house</h1><p>Dunwoody Drive · <span class="newkey">blue</span> is new construction</p></div></div>
  <div class="seg view" role="group" aria-label="View">
    <button data-view="walk" aria-pressed="false">Walk</button>
    <button data-view="plan" aria-pressed="false">Floor plan</button>
    <button data-view="three" aria-pressed="true">¾ view</button>
  </div>
  <div class="barend">
    <label class="field">Light <select id="tod"></select></label>
    <label class="field sunf" title="Turn the sun around the house (double-click to reset)">Sun <input type="range" id="sunTurn" min="-180" max="180" step="5" value="0"><span id="sunTurnV">0°</span></label>
    <div class="seg q" role="group" aria-label="Render quality">
      <button data-q="ultra" aria-pressed="false" title="Bounce light, real reflections, soft shadows from room lights, supersampling. Takes longer to settle.">Ultra</button>
      <button data-q="high" aria-pressed="true">High</button>
      <button data-q="fast" aria-pressed="false">Fast</button>
    </div>
  </div>
  <p id="qnote" style="display:none"></p>
</div>

<div id="top" class="panel">
  <section class="grp" aria-labelledby="gShow"><h3 id="gShow">Show</h3>
    <div class="ctl col">
      <button class="chip sw" id="tTrees" aria-pressed="true">Trees</button>
      <button class="chip sw" id="tLabels" aria-pressed="true">Room names</button>
      <button class="chip sw" id="tDims" aria-pressed="true">Measurements</button>
      <button class="chip sw" id="tSite" aria-pressed="false">Setback lines</button>
      <button class="chip sw" id="tSurround" aria-pressed="false">Surroundings</button>
    </div>
  </section>
  <section class="grp" aria-labelledby="gTools"><h3 id="gTools">Tools</h3>
    <div class="ctl col">
      <label class="field">Jump to <select id="goto"></select></label>
      <div class="row"><button class="chip" id="tArrange" aria-pressed="false">Arrange furniture</button><button class="chip" id="tDebug" aria-pressed="false">Debug IDs</button></div>
    </div>
  </section>
</div>

<div id="levels" class="panel">
  <h2>Levels</h2>
  <p id="lvlHint"></p>
  <button class="lvl" id="allbtn" style="position:relative" aria-pressed="true">Whole house</button>
  <div id="section"></div>
  <div id="lvlKey"><span><i></i>Existing</span><span><i class="new"></i>New addition</span></div>
</div>

<div id="hud" class="panel">
  <div id="where"></div>
  <div class="help" id="help"></div>
  <div id="refine" style="display:none"></div>
  <button class="chip" id="tPhoto" title="A 24 mm, level, fully rendered photo of this view for Gemini (Nano Banana), copied to the clipboard">Photo for Gemini</button>
</div>
<div id="shot" class="panel" role="dialog" aria-label="Photo for Gemini" style="display:none">
  <img id="shotImg" alt="The captured photo">
  <p id="shotMsg"></p>
  <div class="row"><button class="chip" id="shotCopy">Copy image</button><button class="chip" id="shotNotes">Copy shot notes</button><button class="chip" id="shotSave">Download</button><button class="chip" id="shotClose">Close</button></div>
</div>
<div id="joy"><i></i></div>
<div id="arr" class="panel" role="region" aria-label="Arrange furniture" style="display:none">
  <div class="arr-head"><strong id="arrName"></strong><span id="arrCount"></span></div>
  <p id="arrInfo"></p>
  <div class="row" id="arrSel">
    <button class="chip" id="arrL" title="Turn 15° left (Q)">⟲ 15°</button><button class="chip" id="arrR" title="Turn 15° right (E)">⟳ 15°</button><button class="chip" id="arr90">Turn 90°</button>
    <button class="chip" id="arrReset">Reset</button><button class="chip on" id="arrCopy">Copy move for Claude</button><button class="chip" id="arrDone">Done</button>
  </div>
  <div class="row arr-all"><button class="chip on" id="arrBake" title="Write every move into the code for good (needs npm run dev)">Save to code</button><button class="chip" id="arrCopyAll">Copy all moves</button><button class="chip" id="arrResetAll">Reset all</button></div>
</div>
<div id="dbg" class="panel" role="dialog" aria-label="Element inspector" style="display:none">
  <div class="dbg-head"><span id="dbgId"></span><span id="dbgKind"></span></div>
  <dl><dt>Level</dt><dd id="dbgLevel"></dd><dt>Code</dt><dd id="dbgLine"></dd><dt>Size</dt><dd id="dbgSize"></dd><dt>Materials</dt><dd id="dbgMats"></dd></dl>
  <pre id="dbgSrc"></pre>
  <div class="row"><button class="chip on" id="dbgCopy">Copy for Claude</button><button class="chip danger" id="dbgDel">Delete</button><button class="chip" id="dbgClose">Close</button></div>
  <div id="dbgConfirm" style="display:none"></div>
</div>

<script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/webgpu":"./vendor/three/build/three.webgpu.js","three/tsl":"./vendor/three/build/three.tsl.js","three/addons/":"./vendor/three/examples/jsm/"}}</script>
<script type="module" src="src/three-boot.mjs"></script>
<script defer src="src/00-boot.js"></script>
<script defer src="src/01-registry.js"></script>
<script defer src="src/02-spec.js"></script>
<script defer src="src/02b-nodes.js"></script>
<script defer src="src/03-textures.js"></script>
<script defer src="src/04-textures-living.js"></script>
<script defer src="src/05-geometry.js"></script>
<script defer src="src/06-house.js"></script>
<script defer src="src/07-furniture.js"></script>
<script defer src="src/08-site.js"></script>
<script defer src="src/08b-gpu-passes.js"></script>
<script defer src="src/08c-gpu-ultra.js"></script>
<script defer src="src/09-look-pipeline.js"></script>
<script defer src="src/10-debug.js"></script>
<script defer src="src/11-arrange.js"></script>
<script defer src="src/12-app.js"></script>
<script defer src="src/13-models.js"></script>
<script defer src="src/14-photo.js"></script>
</body>
</html>
