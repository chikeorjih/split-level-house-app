<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Split-level walkthrough with addition and deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#232a31; --ink-2:#56606a; --paper:#eef1f2; --panel:rgba(246,248,249,.92);
  --line:#c9d0d5; --blue:#2c66c9; --blue-soft:#dbe6f8; --red:#c9443b; --plan-bg:#f3f4f1;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e6eaee; --ink-2:#a3adb6; --paper:#15191d; --panel:rgba(27,32,37,.92);
    --line:#39424a; --blue:#7aa7f0; --blue-soft:#24344d; --red:#e0675e; --plan-bg:#f3f4f1;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --ink:#e6eaee; --ink-2:#a3adb6; --paper:#15191d; --panel:rgba(27,32,37,.92);
  --line:#39424a; --blue:#7aa7f0; --blue-soft:#24344d; --red:#e0675e; color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:var(--paper);color:var(--ink);
  font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.4}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%;outline:none}
.panel{position:fixed;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);border-radius:10px;z-index:5}
#top{left:12px;top:calc(12px + env(safe-area-inset-top,0px));padding:10px 12px;display:flex;flex-direction:column;gap:8px;max-width:calc(100vw - 24px)}
#top h1{font-size:15px;font-weight:650;font-stretch:88%;margin:0;letter-spacing:.005em}
#top p{margin:0;color:var(--ink-2);font-size:12.5px}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;width:max-content}
.seg button{all:unset;box-sizing:border-box;cursor:pointer;padding:6px 12px;font-size:13px;font-weight:550;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button:focus-visible,.lvl:focus-visible,.chip:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{all:unset;box-sizing:border-box;cursor:pointer;font-size:12px;padding:4px 9px;border:1px solid var(--line);border-radius:20px;color:var(--ink-2)}
.chip[aria-pressed="true"]{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
select{font:inherit;font-size:12.5px;padding:4px 6px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--ink)}
select option{color:#222}
/* split-level section selector */
#levels{right:12px;top:calc(12px + env(safe-area-inset-top,0px));padding:10px;width:208px}
#levels h2{font-size:12.5px;font-weight:600;margin:0 0 6px;color:var(--ink-2);font-stretch:90%}
#section{position:relative;height:164px}
.lvl{all:unset;box-sizing:border-box;cursor:pointer;position:absolute;overflow:hidden;white-space:nowrap;height:30px;border:1.5px solid var(--ink-2);border-radius:3px;
  display:flex;align-items:center;padding:0 7px;font-size:11.5px;font-weight:600;color:var(--ink);background:transparent;line-height:1.1}
.lvl small{display:block;font-weight:450;color:var(--ink-2);font-size:10.5px}
.lvl[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.lvl[aria-pressed="true"] small{color:var(--paper);opacity:.75}
.lvl.new{border-color:var(--blue)}
#allbtn{margin-top:6px;width:100%;justify-content:center;height:28px}
#hud{left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:8px 11px;font-size:12.5px;max-width:min(440px,calc(100vw - 24px))}
#hud b{font-weight:650}
#hud .k{color:var(--ink-2)}
#refine{margin-top:3px;font-size:11.5px;color:var(--blue)}
.seg.q button{padding:4px 10px;font-size:12px}
#qnote{margin:0;font-size:11.5px;color:var(--ink-2);max-width:340px}
#where{font-size:13.5px;font-weight:600;margin-bottom:2px}
#labels{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.rl{position:absolute;transform:translate(-50%,-50%);text-align:center;font-size:10.5px;font-weight:500;color:rgba(31,38,44,.72);letter-spacing:.02em;
  white-space:nowrap;text-shadow:0 0 2px rgba(255,255,255,.85),0 0 6px rgba(255,255,255,.55);font-stretch:92%}
.rl small{display:block;font-weight:400;font-size:9.5px;color:rgba(60,68,76,.62);letter-spacing:0;margin-top:1px}
.rl.new{color:rgba(31,79,163,.8)}
body.nodims .rl small{display:none}
#labels .dbgchip{position:absolute;transform:translate(-50%,-50%);font:600 10.5px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:2px 5px;border-radius:4px;
  color:#fff;border:1px solid rgba(255,255,255,.4);pointer-events:auto;cursor:pointer;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.dbgchip:hover,.dbgchip:focus-visible{outline:2px solid #ff2d6f;z-index:2}
.k-wall{background:rgba(34,40,47,.88)}.k-floor{background:rgba(120,78,40,.9)}.k-ceil{background:rgba(110,118,126,.9)}.k-furn{background:rgba(44,102,201,.92)}.k-open{background:rgba(16,128,108,.92)}.k-other{background:rgba(96,74,150,.9)}
#dbg{right:12px;top:calc(278px + env(safe-area-inset-top,0px));width:320px;max-width:calc(100vw - 24px);padding:12px;z-index:9}
#dbg .dbg-head{display:flex;gap:8px;align-items:baseline;margin-bottom:6px}
#dbgId{font:700 20px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#ff2d6f}#dbgKind{font-size:13px;color:var(--ink-2)}
#dbg dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:0 0 8px;font-size:12.5px}#dbg dt{color:var(--ink-2)}#dbg dd{margin:0}
#dbgSrc{margin:0 0 8px;padding:6px 8px;background:rgba(127,127,127,.12);border-radius:6px;font:11px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;max-height:96px;overflow:auto}
.chip.on{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
#dbgHint{left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));padding:6px 10px;font-size:12px;color:var(--ink-2);max-width:min(420px,calc(100vw - 24px));z-index:4}
@media (max-width:640px){#dbg{top:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:12px;right:12px;width:auto}#dbgHint{display:none!important}}
#arr{right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(420px,calc(100vw - 24px));padding:10px 12px;z-index:9}
#arr .arr-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline}#arrName{font-size:14px;font-weight:650}#arrCount{font-size:12px;color:var(--ink-2)}
#arrInfo{margin:3px 0 8px;font-size:12px;color:var(--ink-2)}#arr .row{gap:6px}#arr .arr-all{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
@media (max-width:640px){#arr{left:12px;right:12px;width:auto;transform:none}}
#joy{position:fixed;left:24px;bottom:calc(96px + env(safe-area-inset-bottom,0px));width:116px;height:116px;border-radius:50%;
  border:1.5px solid rgba(255,255,255,.7);background:rgba(20,26,32,.25);z-index:6;display:none;touch-action:none}
#joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,.85)}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--paper);z-index:20;font-size:14px;color:var(--ink-2)}
#err{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:30;padding:14px 16px;max-width:380px}
@media (max-width:640px){
  #levels{top:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:186px;padding:8px}
  #section{height:150px}
  .lvl{font-size:10.5px;padding:0 5px}
  #top h1{font-size:13.5px}
  #hud{max-width:calc(100vw - 222px);font-size:11.5px}
  #joy{bottom:calc(120px + env(safe-area-inset-bottom,0px))}
  #hud .help{display:none}
  #top p{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
/* panel minimise buttons */
.pmin{all:unset;box-sizing:border-box;cursor:pointer;position:absolute;top:6px;right:6px;min-width:22px;height:22px;display:grid;place-items:center;border-radius:5px;color:var(--ink-2);font-size:15px;line-height:1}
.pmin:hover{background:var(--line)}.pmin:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
#top h1,#levels h2,#hud #where{padding-right:24px}
.panel.min{padding:0!important;width:auto!important}
.panel.min>*:not(.pmin){display:none!important}
.panel.min .pmin{position:static;height:auto;padding:7px 12px;font-size:12.5px;font-weight:600;color:var(--ink)}
</style>
</head>
<body>
<div id="stage"></div>
<div id="labels"></div>
<div id="loading">Building the house…</div>
<div id="err" class="panel"></div>

<div id="top" class="panel">
  <h1>Split-level house, with the four-seasons addition and new deck</h1>
  <p>Blue marks new construction from your two concept plans.</p>
  <div class="seg" role="group" aria-label="View">
    <button data-view="walk" aria-pressed="false">Walk</button>
    <button data-view="plan" aria-pressed="false">Floor plan</button>
    <button data-view="three" aria-pressed="true">¾ view</button>
  </div>
  <div class="row">
    <button class="chip" id="tTrees" aria-pressed="true">Trees</button>
    <button class="chip" id="tLabels" aria-pressed="true">Room names</button>
    <button class="chip" id="tDims" aria-pressed="true">Measurements</button>
    <button class="chip" id="tSite" aria-pressed="false">Setback lines</button>
    <button class="chip" id="tDebug" aria-pressed="false">Debug IDs</button>
    <button class="chip" id="tArrange" aria-pressed="false">Arrange</button>
    <label class="row" style="gap:4px;font-size:12px;color:var(--ink-2)">Go to
      <select id="goto"></select></label>
  </div>
  <div class="row">
    <label class="row" style="gap:4px;font-size:12px;color:var(--ink-2)">Light
      <select id="tod"></select></label>
    <div class="seg q" role="group" aria-label="Render quality">
      <button data-q="high" aria-pressed="true">High quality</button>
      <button data-q="fast" aria-pressed="false">Fast</button>
    </div>
  </div>
  <p id="qnote" style="display:none"></p>
</div>

<div id="levels" class="panel">
  <h2>Levels</h2>
  <div id="section"></div>
  <button class="lvl" id="allbtn" style="position:relative" aria-pressed="true">Whole house</button>
</div>

<div id="hud" class="panel">
  <div id="where"></div>
  <div class="help" id="help"></div>
  <div id="refine" style="display:none"></div>
</div>
<div id="joy"><i></i></div>
<div id="arr" class="panel" role="region" aria-label="Arrange furniture" style="display:none">
  <div class="arr-head"><strong id="arrName"></strong><span id="arrCount"></span></div>
  <p id="arrInfo"></p>
  <div class="row" id="arrSel">
    <button class="chip" id="arrL" title="Turn 15° left (Q)">⟲ 15°</button><button class="chip" id="arrR" title="Turn 15° right (E)">⟳ 15°</button><button class="chip" id="arr90">Turn 90°</button>
    <button class="chip" id="arrReset">Reset</button><button class="chip on" id="arrCopy">Copy move for Claude</button><button class="chip" id="arrDone">Done</button>
  </div>
  <div class="row arr-all"><button class="chip" id="arrCopyAll">Copy all moves</button><button class="chip" id="arrResetAll">Reset all</button></div>
</div>
<div id="dbg" class="panel" role="dialog" aria-label="Element inspector" style="display:none">
  <div class="dbg-head"><span id="dbgId"></span><span id="dbgKind"></span></div>
  <dl><dt>Level</dt><dd id="dbgLevel"></dd><dt>Code</dt><dd id="dbgLine"></dd><dt>Size</dt><dd id="dbgSize"></dd><dt>Materials</dt><dd id="dbgMats"></dd></dl>
  <pre id="dbgSrc"></pre>
  <div class="row"><button class="chip on" id="dbgCopy">Copy for Claude</button><button class="chip" id="dbgClose">Close</button></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>if(!window.THREE){document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"><\/script>')}</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>if(!THREE.GLTFLoader){document.write('<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"><\/script>')}</script>
<script>
// 00-boot.js: boot: strict mode and the on-screen error reporter
"use strict";
window.addEventListener('error',e=>{const b=document.getElementById('err');b.style.display='block';b.textContent='Something failed while building the scene: '+e.message+'. Reload the page to try again.';});
// 01-registry.js: element registry behind Debug IDs (maps every piece of geometry to the source line that built it)
"use strict";
// ================= ELEMENT REGISTRY (powers debug mode) =================
// Every wall, opening, floor, ceiling, furniture piece and build call gets a stable ID tied to the line in this file that creates it.
try{Error.stackTraceLimit=40;}catch(e){}
const __SRC_TEXT=(document.currentScript&&document.currentScript.textContent)||'';
const __MARK_REPORTED=(()=>{const fr=parseStack(new Error().stack);return fr.length?fr[0].line:0;})();
const __LINE_OFFSET=(()=>{try{const h=document.documentElement.outerHTML,i=h.indexOf('<title>');return i<0?0:(3+(h.slice(0,i).match(/\n/g)||[]).length)-6;}catch(e){return 0;}})();
const __SRC_LINES=__SRC_TEXT.split('\n'),__MARK_IDX=Math.max(0,__SRC_LINES.findIndex(l=>l.indexOf('const __MARK_REPORTED=')>=0));
function parseStack(st){const out=[];for(const l of String(st||'').split('\n')){const s=l.trim();if(!s||/^Error/.test(s))continue;
    const m=s.match(/^(?:at\s+)?(?:(.*?)\s+\(|([^@\s]*)@)?(.*?):(\d+):(\d+)\)?$/);if(!m)continue;
    let fn=(m[1]||m[2]||'').replace(/^async\s+/,'').replace(/^new\s+/,'');fn=fn.split('.').pop();out.push({fn,line:+m[4],col:+m[5],url:m[3]||''});}return out;}
function fileLine(rep){return rep-__LINE_OFFSET;}
const __MARK_LINE=fileLine(__MARK_REPORTED);
const DIST_NAME='house-walkthrough.html',SRC_CACHE={};
// in the multi-file project each script is its own file; fetch their text once so the inspector can show code snippets
addEventListener('DOMContentLoaded',()=>{for(const s of document.querySelectorAll('script[src]')){const u=s.getAttribute('src');if(!/^src\/.*\.js$/.test(u))continue;
  fetch(u).then(r=>r.ok?r.text():'').then(t=>{SRC_CACHE[u]=t.split('\n');}).catch(()=>{});}});
function locOf(f){const u=f.url||'';if(/\.js([?#].*)?$/.test(u)){const path=u.replace(/^[a-z]+:\/\/[^/]+\//i,'').replace(/^\/+/,'').replace(/[?#].*$/,'');return {file:path,line:f.line,col:f.col};}
  return {file:DIST_NAME,line:fileLine(f.line),col:f.col};}
function locKey(l){return l?(l.file||'')+':'+l.line+':'+l.col:String(Math.random());}
function srcLineOf(l){if(!l)return '';if(l.file===DIST_NAME)return __SRC_LINES[l.line-__MARK_LINE+__MARK_IDX]||'';const c=SRC_CACHE[l.file];return c?(c[l.line-1]||''):'';}
function srcFind(text){const i=__SRC_LINES.findIndex(l=>l.indexOf(text)>=0);if(__SRC_TEXT&&i>=0)return {file:DIST_NAME,line:i-__MARK_IDX+__MARK_LINE,col:1};
  for(const f in SRC_CACHE){const j=SRC_CACHE[f].findIndex(l=>l.indexOf(text)>=0);if(j>=0)return {file:f,line:j+1,col:1};}return null;}
const TOP_FNS=new Set(['buildSpec','buildHouse','buildFurniture','buildSiteHard']);
function here(){const fr=parseStack(new Error().stack);for(let i=0;i<fr.length;i++)if(TOP_FNS.has(fr[i].fn))return Object.assign(locOf(fr[i]),{fn:i>0?fr[i-1].fn:''});return null;}
const REG=new Map(),REGC={};let OWNER=null;
const KIND_BY_FN={stairFlight:'stair',railRun:'railing',deck:'deck',art:'wall art',mirror:'mirror',bathMirror:'mirror',pendantCone:'light fixture',chandelier:'light fixture',flushDrum:'light fixture',
  schoolhouse:'light fixture',drape:'curtains',rod:'curtain rod',rug:'rug',tub:'tub',showerTileWalls:'shower',glassPanel:'shower glass',showerHead:'shower',mansard:'roof',dormer:'dormer',hipRoof:'roof',
  polyWall:'wall infill',b:'decor',g:'decor',fd:'foundation',fence:'fence',beam:'beam',box:'built-in part',quadSlab:'slab',addGeo:'part',RF:'roof'};
const OPEN_LABEL={win:'window',frost:'frosted window',door:'door',door2:'double door',gdoor:'glass door',dbl:'front doors',slide:'sliding door',closet:'closet doors',garage:'garage door',open:'cased opening',open0:'opening',bay:'bay window'};
function kindFor(fn,tag){if(tag==='roof')return fn==='dormer'?'dormer':'roof';if(tag&&tag[0]==='C')return 'ceiling light';return KIND_BY_FN[fn]||(tag==='site'?'site':'part');}
function nextId(kind){const p=kind==='wall'?'W':kind==='floor'?'F':kind==='ceiling'?'C':kind==='furniture'?'FU':(kind==='roof'||kind==='dormer')?'R':(kind==='stair'||kind==='railing')?'ST':'X';REGC[p]=(REGC[p]||0)+1;return p+REGC[p];}
function ensureEl(o){let e=REG.get(o.key);if(!e){e={key:o.key,kind:o.kind,fn:o.fn||'',label:o.label||'',loc:o.loc||null,parent:o.parent||null,boxes:[],mats:new Set(),id:o.id||nextId(o.kind)};REG.set(o.key,e);}return e;}
function regPiece(tag,mat,x0,y0,z0,x1,y1,z1){LAST_EL=null;if(tag==='trees'||tag==='grass')return;if(!(x1>=x0&&y1>=y0&&z1>=z0))return;
  let e;if(OWNER)e=ensureEl(OWNER);else{const h=here();if(!h)return;e=ensureEl({key:'@'+locKey(h),kind:kindFor(h.fn,tag),fn:h.fn,loc:h});}
  e.boxes.push([x0,y0,z0,x1,y1,z1,tag]);e.mats.add(mat);LAST_EL=e;if(DOLL_WCUR>=0&&e.dollWall===undefined)e.dollWall=DOLL_WCUR;}
// 02-spec.js: house layout data: levels, walls, openings, floors, ceilings, rooms, stairs (feet)
"use strict";
// ================= LAYOUT SPEC (feet; x = east, z = toward street, y = up) =================
// Levels: 1 = lower/basement, 2 = family-room level, 3 = main, 4 = bedrooms. Split-level offsets of ~4.5 ft.
const E = {1:-13.5, 2:-4.5, 3:0, 4:4.5};
const CEIL = {1:-5.5, 2:3.5, 3:8, 4:12.5};
const LEVEL_NAMES = {1:'Lower level', 2:'Family room level', 3:'Main level', 4:'Bedroom level'};
function buildSpec(){
  const TI=0.4, TE=0.6;
  const walls=[], floors=[], ceils=[], rooms=[], stairs=[];
  const W=o=>{o.t=o.t||TI; o.ops=o.ops||[]; o.loc=here(); walls.push(o); return o;};
  const win=(c,w,e,sill,head,n)=>({k:'win',c,w,y0:e+sill,y1:e+head,n:n||Math.max(1,Math.round(w/2))});
  const door=(c,w,e,sw,h)=>({k:'door',c,w:w||2.6,y0:e,y1:e+(h||6.8),sw:sw||[-1,1]});
  const op=(k,c,w,e,h,extra)=>Object.assign({k,c,w,y0:e,y1:e+h},extra||{});
  const E1=E[1],E2=E[2],E3=E[3],E4=E[4];
  const F=(lv,x0,x1,z0,z1,mat,y)=>floors.push({lv,x0,x1,z0,z1,mat,y:(y===undefined?E[lv]:y),loc:here()});
  const C=(lv,x0,x1,z0,z1,y)=>ceils.push({lv,x0,x1,z0,z1,y:(y===undefined?CEIL[lv]:y),loc:here()});
  const R=(lv,name,dim,x0,x1,z0,z1,isNew)=>rooms.push({lv,name,dim,x0,x1,z0,z1,isNew:!!isNew});

  // ---------- WING exterior (family room / bedrooms side) ----------
  W({lv:1,x0:0,z0:0,x1:14.2,z1:0,t:TE,y0:-14.5,y1:-5.5,ext:{side:-1,mat:'brick'},bb:[[E1,1]]});

  const [c,g]=cv(W,H),o=g.createImageData(W,H),q=o.data,at=(x,y)=>h[((y+H)%H)*W+((x+W)%W)];

"use strict";
// ================= GEOMETRY ENGINE =================
const BUCKETS=new Map(); const COLS=[]; const WALKS=[]; const PIECES=[];
// dollhouse bookkeeping: every W() wall, the wall being built right now, and per bucket the vertex runs [start,end,element] each build call added
const DOLL_WALLS=[];let DOLL_WCUR=-1,LAST_EL=null;
function elRange(b,s0){if(LAST_EL&&b.p.length>s0)(b.er=b.er||[]).push(s0,b.p.length,LAST_EL);}
function bucket(tag,mat,flags){const k=tag+'|'+mat+'|'+(flags||'');let b=BUCKETS.get(k);
  if(!b){b={tag,mat,flags:flags||'',p:[],n:[],u:[]};BUCKETS.set(k,b);}return b;}
function addCol(x0,x1,z0,z1,y0,y1){const c={x0:Math.min(x0,x1),x1:Math.max(x0,x1),z0:Math.min(z0,z1),z1:Math.max(z0,z1),y0,y1};COLS.push(c);return c;}
let INST_TARGET=null;
function instBucket(inst,tag,mat){let b=inst.buckets.get(mat);if(!b){b={tag,mat,p:[],n:[],u:[]};inst.buckets.set(mat,b);}return b;}
function addWalk(x0,x1,z0,z1,top){WALKS.push({x0:Math.min(x0,x1),x1:Math.max(x0,x1),z0:Math.min(z0,z1),z1:Math.max(z0,z1),top});}
// axis-aligned box with world-scale UVs (1 unit = 1 ft)
function box(tag,mat,x0,x1,y0,y1,z0,z1,flags){
  if(x0>x1)[x0,x1]=[x1,x0]; if(y0>y1)[y0,y1]=[y1,y0]; if(z0>z1)[z0,z1]=[z1,z0];
  if(x1-x0<1e-4||y1-y0<1e-4||z1-z0<1e-4)return;
  regPiece(tag,mat,x0,y0,z0,x1,y1,z1);
  const b=bucket(tag,mat,flags),P=b.p,N=b.n,U=b.u,s0=P.length;
  const q=(a,bb,c,d,n,uv)=>{for(const v of [a,bb,c,a,c,d]){P.push(v[0],v[1],v[2]);N.push(n[0],n[1],n[2]);U.push(uv(v)[0],uv(v)[1]);}};
  const ux=v=>[v[2],v[1]],uy=v=>[v[0],v[2]],uz=v=>[v[0],v[1]];
  q([x1,y0,z1],[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[1,0,0],v=>[-v[2],v[1]]);
  q([x0,y0,z0],[x0,y0,z1],[x0,y1,z1],[x0,y1,z0],[-1,0,0],ux);
  q([x0,y1,z1],[x1,y1,z1],[x1,y1,z0],[x0,y1,z0],[0,1,0],uy);
  q([x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1],[0,-1,0],uy);
  q([x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1],[0,0,1],uz);
  q([x1,y0,z0],[x0,y0,z0],[x0,y1,z0],[x1,y1,z0],[0,0,-1],v=>[-v[0],v[1]]);
  elRange(b,s0);
}

const ADDGEO=(...a)=>addGeo(...a);
function addGeo(tag,mat,geo,matrix,flags){
  let g=geo.index?geo.toNonIndexed():geo.clone(); if(matrix)g.applyMatrix4(matrix);
  const b=INST_TARGET?instBucket(INST_TARGET,tag,mat):bucket(tag,mat,flags),p=g.attributes.position.array,n=g.attributes.normal?g.attributes.normal.array:null,u=g.attributes.uv?g.attributes.uv.array:null,s0=b.p.length;
  let a0=1e9,a1=1e9,a2=1e9,b0=-1e9,b1=-1e9,b2=-1e9;
  for(let i=0;i<p.length/3;i++){const X=p[i*3],Y=p[i*3+1],Z=p[i*3+2];b.p.push(X,Y,Z);if(X<a0)a0=X;if(Y<a1)a1=Y;if(Z<a2)a2=Z;if(X>b0)b0=X;if(Y>b1)b1=Y;if(Z>b2)b2=Z;
    if(n)b.n.push(n[i*3],n[i*3+1],n[i*3+2]);else b.n.push(0,1,0);
    if(u)b.u.push(u[i*2],u[i*2+1]);else b.u.push(0,0);}
  regPiece(tag,mat,a0,a1,a2,b0,b1,b2);if(!INST_TARGET)elRange(b,s0);

// 13-models.js: imported furniture models (GLB/glTF, e.g. from Sketchfab) listed in assets/models/manifest.json
"use strict";
// ================= IMPORTED MODELS =================
// Each model is turned upright by its `orient`, scaled to real size (feet per model unit, from its units or its product spec), stood on its
// level's floor at a plan position, and can stand in for a T() piece (`replaces`: that piece's name), which it then hides.
// modelReport() checks every placed model: its size against the product spec, and its fit in the plan (rooms, walls, door swings, furniture).
const MODELS=[],MODEL_TOL={in:.5,pct:.02};let MODELS_READY=false;
const UNIT_FT={m:3.28084,cm:.0328084,mm:.00328084,in:1/12,ft:1};
// feet per model unit: an explicit number or unit name, else the standard unit that matches the spec, else a uniform fit to the spec
function modelScale(m,raw){const sp=m.spec;
  if(typeof m.scale==='number')return {s:m.scale,how:'manifest scale'};
  if(typeof m.scale==='string'&&UNIT_FT[m.scale])return {s:UNIT_FT[m.scale],how:'units: '+m.scale};
  if(!sp)return {s:UNIT_FT.m,how:'assumed metres (no spec)'};
  const err=s=>Math.max(...['w','d','h'].map(k=>Math.abs(raw[k]*s*12-sp[k])/sp[k]));
  let best=null;for(const u in UNIT_FT){const e=err(UNIT_FT[u]);if(!best||e<best.e)best={u,e};}
  if(best.e<=MODEL_TOL.pct*1.5)return {s:UNIT_FT[best.u],how:'true to scale in '+best.u};
  const sw={w:raw.d,d:raw.w,h:raw.h},err2=s=>Math.max(...['w','d','h'].map(k=>Math.abs(sw[k]*s*12-sp[k])/sp[k]));
  for(const u in UNIT_FT)if(err2(UNIT_FT[u])<=MODEL_TOL.pct*1.5)return {s:UNIT_FT[u],how:'true to scale in '+u+', but turned 90° (its width and depth are swapped)'};
  const r=['w','d','h'].map(k=>sp[k]/12/raw[k]).sort((a,b)=>a-b);
  return {s:r[1],how:'not to scale in any standard unit; fitted ×'+(r[1]/UNIT_FT[best.u]).toFixed(3)+' from '+best.u};}
async function loadModels(){
  try{let man=window.__MODEL_MANIFEST||null;
    if(!man&&/^https?:/.test(location.protocol)){try{const r=await fetch('assets/models/manifest.json',{cache:'no-store'});if(r.ok)man=await r.json();}catch(e){}}
    if(!man||!man.models||!THREE.GLTFLoader)return;const L=new THREE.GLTFLoader();
    for(const m of man.models){if(m.enabled===false)continue;
      const url=(window.__MODEL_FILES&&window.__MODEL_FILES[m.file])||('assets/models/'+m.file);
      try{const g=await new Promise((res,rej)=>L.load(url,res,undefined,rej));placeModel(m,g.scene);}catch(e){console.warn('model '+m.id+' failed to load',e);}}
    if(MODELS.length){retarget(true);updateSectionDisplay();shadowDirty=true;dirty=true;}}
  finally{MODELS_READY=true;}}
function placeModel(m,root){const o=m.orient||{},D=Math.PI/180,pl=m.place||{};
  root.rotation.set((o.x||0)*D,(o.y||0)*D,(o.z||0)*D);root.updateMatrixWorld(true);
  const bb=new THREE.Box3().setFromObject(root),raw={w:bb.max.x-bb.min.x,d:bb.max.z-bb.min.z,h:bb.max.y-bb.min.y},sc=modelScale(m,raw);
  const inner=new THREE.Group();inner.add(root);inner.scale.setScalar(sc.s);inner.position.set(-(bb.min.x+bb.max.x)/2*sc.s,-bb.min.y*sc.s,-(bb.min.z+bb.max.z)/2*sc.s);
  // the T() piece it replaces: the nearest piece with that name; it also supplies any position, level or turn the manifest leaves out
  let rep=null;if(m.replaces){const near=new THREE.Vector3(pl.x||0,0,pl.z||0),c=INSTS.filter(i=>{const e=REG.get(i.okey)||{};return i.group&&!i.hiddenByModel&&(e.label===m.replaces||e.id===m.replaces);});
    rep=c.sort((a,b)=>(pl.x===undefined?0:a.group.position.distanceToSquared(near)-b.group.position.distanceToSquared(near)))[0]||null;
    if(!rep)console.warn('model '+m.id+': no furniture piece named "'+m.replaces+'"');else if(REG.get(rep.okey).id===m.replaces)console.warn('model '+m.id+': replaces uses Debug ID '+m.replaces+', which can change when code is edited; give that T() piece a name instead');}
  const rb=rep?new THREE.Box3().setFromObject(rep.group):null,lv=pl.lv||(rep&&/^[1-4]$/.test(rep.tag)?+rep.tag:3);
  const x=pl.x!==undefined?pl.x:(rb?(rb.min.x+rb.max.x)/2:0),z=pl.z!==undefined?pl.z:(rb?(rb.min.z+rb.max.z)/2:0);
  const ry=pl.ry!==undefined?pl.ry*D:(rep?rep.ry0+rep.ry:0)+(pl.turn||0)*D,y=pl.y!==undefined?pl.y:E[lv]+(pl.dy||0),tag=m.tag||String(lv);
  const outer=new THREE.Group();outer.position.set(x,y,z);outer.rotation.y=ry;outer.add(inner);outer.userData.model=m.id;
  const P=PRESETS[LOOK.preset];let n=0;
  const fix=mt=>{mt.clippingPlanes=CLIPS;mt.clipShadows=true;dollPatch(mt);if(mt.isMeshStandardMaterial){mt.envMap=ROOM_ENV;mt.envMapIntensity=P.envI;}MAT['model:'+m.id+':'+(n++)]=mt;mt.needsUpdate=true;return mt;};
  outer.traverse(c=>{if(!c.isMesh)return;c.castShadow=c.receiveShadow=true;c.userData.tag=tag;c.userData.model=m.id;
    c.material=Array.isArray(c.material)?c.material.map(fix):fix(c.material);c.userData.baseMat=c.material;});
  if(rep){rep.group.visible=false;rep.hiddenByModel=true;for(const q of rep.cols){const i=COLS.indexOf(q.c);if(i>=0)COLS.splice(i,1);}}
  addTag(tag,outer);outer.updateMatrixWorld(true);const box=new THREE.Box3().setFromObject(outer);
  if(m.collide!==false)addCol(box.min.x,box.max.x,box.min.z,box.max.z,box.min.y,box.max.y);
  MODELS.push({m,outer,raw,sc,box,rep,repBox:rb,lv,tag,ry});}
// ---------- dimension and fit check ----------
function modelReport(){const r2=v=>Math.round(v*100)/100,ro=o=>{const q={};for(const k in o)q[k]=r2(o[k]);return q;};
  const ok=(spec,got)=>Math.abs(got-spec)<=Math.max(MODEL_TOL.in,spec*MODEL_TOL.pct);
  const ov=(a0,a1,b0,b1)=>Math.min(a1,b1)-Math.max(a0,b0);
  const gap=(f,g)=>Math.hypot(Math.max(0,g.x0-f.x1,f.x0-g.x1),Math.max(0,g.z0-f.z1,f.z0-g.z1));
  return MODELS.map(R=>{const {m,raw,sc,box,lv}=R,s=sc.s,dims={w:raw.w*s*12,d:raw.d*s*12,h:raw.h*s*12},sp=m.spec,issues=[],notes=[];
    const r={id:m.id,name:m.name||m.id,file:m.file,scale:sc.how,ftPerUnit:+s.toPrecision(5),rawUnits:ro(raw),dims_in:ro(dims),issues,notes};
    if(sp){r.spec_in={w:sp.w,d:sp.d,h:sp.h};r.diff_in={};
      for(const k of ['w','d','h']){const d=dims[k]-sp[k];r.diff_in[k]=r2(d);
        if(!ok(sp[k],dims[k]))issues.push(`${({w:'width',d:'depth',h:'height'})[k]} is ${dims[k].toFixed(1)}" but the product is ${sp[k]}" (${d>0?'+':''}${d.toFixed(1)}")`);}
      if(issues.length&&ok(sp.w,dims.d)&&ok(sp.d,dims.w))notes.push('width and depth look swapped: try orient y:90');
      if(issues.length&&(ok(sp.h,dims.d)||ok(sp.h,dims.w)))notes.push('height matches a horizontal side: the model may be Z-up, try orient x:-90');}
    else issues.push('no product dimensions (spec) to check against');
    const f={x0:box.min.x,x1:box.max.x,z0:box.min.z,z1:box.max.z,y0:box.min.y,y1:box.max.y};
    r.place={lv,x:r2((f.x0+f.x1)/2),z:r2((f.z0+f.z1)/2),ryDeg:Math.round(R.ry*180/Math.PI),floorY:r2(f.y0)};r.footprint_ft=ro(f);
    // rooms: the footprint should sit inside the rooms of its level (open plans span several room rectangles)
    const rooms=SPEC.rooms.filter(q=>q.lv===lv),inR=(x,z)=>rooms.find(q=>x>=Math.min(q.x0,q.x1)-.05&&x<=Math.max(q.x0,q.x1)+.05&&z>=Math.min(q.z0,q.z1)-.05&&z<=Math.max(q.z0,q.z1)+.05);
    const c=inR(r.place.x,r.place.z);r.room=c?c.name:null;if(!c)issues.push('its centre is not inside any room on '+LEVEL_NAMES[lv].toLowerCase());
    let out=0;for(let i=0;i<=4;i++)for(let j=0;j<=4;j++)if(!inR(f.x0+(f.x1-f.x0)*i/4,f.z0+(f.z1-f.z0)*j/4))out++;
    if(out)issues.push('part of its footprint is outside the rooms of this level');
    // walls: no wall piece may cut into it; report the nearest wall
    let near=1e9;for(const w of PIECES){if(ov(f.y0+.05,f.y1,w.y0,w.y1)<=0)continue;
      const g=w.ax==='x'?{x0:w.a0,x1:w.a1,z0:w.c-w.t/2,z1:w.c+w.t/2}:{x0:w.c-w.t/2,x1:w.c+w.t/2,z0:w.a0,z1:w.a1};
      const px=ov(f.x0,f.x1,g.x0,g.x1),pz=ov(f.z0,f.z1,g.z0,g.z1);
      if(px>.02&&pz>.02){const ax=w.ax==='x'?'z':'x',fc=ax==='x'?(f.x0+f.x1)/2:(f.z0+f.z1)/2,sg=fc>=w.c?1:-1,pen=ax==='x'?px:pz,to=r2((ax==='x'?r.place.x:r.place.z)+sg*(pen+.02));
        issues.push(`runs ${(pen*12).toFixed(1)}" into a ${w.glass?'window':'wall'} at ${ax} = ${r2(w.c)}; moving it to place.${ax} = ${to} would clear it`);near=0;}
      else near=Math.min(near,gap(f,g));}
    r.nearestWall_in=near<1e8?r2(near*12):null;
    // door swings (a square the width of the door, on its swing side)
    for(const d of DOORS){if(ov(f.y0,f.y1,d.y0,d.y0+6.8)<=0)continue;const w=d.oa1-d.oa0,f0=d.c+d.side*d.t/2,f1=f0+d.side*w;
      const g=d.ax==='x'?{x0:d.oa0,x1:d.oa1,z0:Math.min(f0,f1),z1:Math.max(f0,f1)}:{x0:Math.min(f0,f1),x1:Math.max(f0,f1),z0:d.oa0,z1:d.oa1};
      if(ov(f.x0,f.x1,g.x0,g.x1)>.05&&ov(f.z0,f.z1,g.z0,g.z1)>.05)issues.push(`blocks the swing of a door at ${d.ax==='x'?'x':'z'} ${r2(d.oa0)} to ${r2(d.oa1)}`);}
    // other furniture and models (ignores rugs and anything barely overlapping)
    const others=[...INSTS.filter(i=>i.group&&!i.hiddenByModel).map(i=>({n:(REG.get(i.okey)||{}).label||'furniture',b:new THREE.Box3().setFromObject(i.group)})),
      ...MODELS.filter(q=>q!==R).map(q=>({n:'model '+q.m.id,b:q.box}))];
    for(const q of others){const b=q.b;if(b.isEmpty()||ov(f.y0,f.y1,b.min.y,b.max.y)<.2)continue;
      const px=ov(f.x0,f.x1,b.min.x,b.max.x),pz=ov(f.z0,f.z1,b.min.z,b.max.z);if(px>.08&&pz>.08)issues.push(`overlaps ${q.n} by ${(Math.min(px,pz)*12).toFixed(1)}"`);}
    // compared with the piece it replaces (plan footprint and height, both as placed)
    if(R.rep){const b=R.repBox,o={w:(b.max.x-b.min.x)*12,d:(b.max.z-b.min.z)*12,h:(b.max.y-b.min.y)*12},n={w:(f.x1-f.x0)*12,d:(f.z1-f.z0)*12,h:(f.y1-f.y0)*12};
      r.replaces={name:m.replaces,old_in:ro(o),new_in:ro(n)};
      for(const [k,lab] of [['w','x (east-west)'],['d','z (toward the street)'],['h','tall']]){const d=n[k]-o[k];if(Math.abs(d)>3)notes.push(`${Math.abs(d).toFixed(1)}" ${d>0?'bigger':'smaller'} ${k==='h'?'in height':'along '+lab} than the ${m.replaces} it replaces`);}}
    else if(m.replaces)issues.push('no furniture piece named "'+m.replaces+'" to replace');
    r.ok=!issues.length;return r;});}
